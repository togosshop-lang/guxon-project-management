name: Apply dashboard milestones v1
on:
  push:
    paths:
      - .github/workflows/test-action.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/apply_dashboard_milestones_v1.py
      - run: npm ci
      - run: npm run build
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app/page.tsx app/globals.css
          git diff --cached --quiet && exit 0
          git commit -m "Add project milestones and browser navigation"
          git push
