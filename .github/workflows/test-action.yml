name: Apply strategy workspace
on:
  push:
    paths:
      - .github/workflows/test-action.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/apply_strategy_decision_workspace.py
      - run: npm ci
      - run: npm run build
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Convert strategy management to decision workspace"
          git push
