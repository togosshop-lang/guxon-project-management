name: Simplify strategy management

on:
  push:
    paths:
      - '.github/workflows/simplify-strategy-management.yml'

permissions:
  contents: write

jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Simplify strategy workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/page.tsx')
          s = p.read_text()

          s = s.replace("{ value:'simple', label:'簡易策略', description:'建立約 10 項核心策略工作，適合一般新品快速上市。' },", "{ value:'simple', label:'精簡策略', description:'建立 4 階段／6 個決策里程碑；真正執行工作集中在新品執行管理。' },")

          new_template = r'''const SIMPLE_STRATEGY_TEMPLATE = [
  {
    name:'商品定位',
    description:'只確認方向，不拆成大量執行任務',
    tasks:[
      { title:'商品定位確認', description:'一次確認目標客群、核心賣點、主要使用情境與競品定位。', ownerDepartment:'負責人', dueOffset:-40 },
    ]
  },
  {
    name:'商業策略',
    description:'確認價格、毛利與主要銷售方式',
    tasks:[
      { title:'商業條件確認', description:'一次確認正式售價、活動／團購價、毛利條件與主要銷售通路。', ownerDepartment:'負責人', dueOffset:-32 },
    ]
  },
  {
    name:'行銷準備',
    description:'只保留需要做決策的行銷里程碑；實際製作回到新品執行管理',
    tasks:[
      { title:'主打溝通方向確認', description:'確認上市最主要的溝通主軸與 1～3 個購買理由。', ownerDepartment:'行銷', dueOffset:-28 },
      { title:'素材方向確認', description:'確認需要哪些商品圖、影片、KOL 與社群素材；實際製作工作由新品執行管理追蹤。', ownerDepartment:'行銷', dueOffset:-25 },
      { title:'上市活動確認', description:'確認首發優惠、組合、贈品與主要活動方式。', ownerDepartment:'行銷', dueOffset:-18 },
    ]
  },
  {
    name:'上市確認',
    description:'上市前只做一次最終決策確認',
    tasks:[
      { title:'上市條件確認', description:'確認價格、庫存、商品頁、素材與主要通路已具備上市條件；細部工作狀態以新品執行管理為準。', ownerDepartment:'負責人', dueOffset:-3 },
    ]
  },
]

const SIMPLE_1688_TASKS = ['''
          s2, n = re.subn(r"const SIMPLE_STRATEGY_TEMPLATE = \[.*?\n\]\n\nconst SIMPLE_1688_TASKS = \[", new_template, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not replace SIMPLE_STRATEGY_TEMPLATE')
          s = s2

          s = s.replace("? '簡易策略 4 階段／10 項工作'", "? '精簡策略 4 階段／6 個決策里程碑'")

          old = "const dashboardStrategyTasks=useMemo(()=>tasks.filter(t=>activeDashboardProjectIds.has(t.project_id) && (effectiveAssigneeFilter==='全部'||String(t.assignee_id)===effectiveAssigneeFilter) && (attentionProjectFilter==='全部'||String(t.project_id)===attentionProjectFilter)),[tasks,activeDashboardProjectIds,effectiveAssigneeFilter,attentionProjectFilter])"
          new = "const dashboardStrategyTasks=useMemo(()=>[] as Task[],[]) // 策略決策不列入首頁執行任務統計"
          if old not in s:
              raise SystemExit('Could not find dashboardStrategyTasks')
          s = s.replace(old, new)

          # 首頁「我的任務」只顯示真正的執行工作，避免策略決策再次造成任務爆量。
          pattern = re.compile(r"return \[\n\s*\.\.\.tasks\.filter\(t=>activeDashboardProjectIds\.has\(t\.project_id\).*?\n\s*\.map\(t=>\(\{key:`my-s-\$\{t\.id\}`.*?\}\)\),\n\s*\.\.\.executionTasks", re.S)
          s3, n = pattern.subn("return [\n      ...executionTasks", s, count=1)
          if n != 1:
              raise SystemExit('Could not simplify myTasks')
          s = s3

          p.write_text(s)
          PY
      - name: Verify build
        run: |
          npm ci
          npm run build
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Simplify strategy management to decision milestones"
          git push
