name: Update XLSX lockfile
on:
  push:
    branches: [xlsx-import-export-v8]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xlsx-import-export-v8
      - run: npm install --package-lock-only
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "Update lockfile for XLSX"
          git push origin HEAD:xlsx-import-export-v8
